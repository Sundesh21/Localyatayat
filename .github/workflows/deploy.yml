name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: localyatayat

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- TEMPORARY DEBUG STEP: prints what GitHub actually sends ----
      # Remove this step once auth is working.
      - name: Print OIDC token claims (debug)
        run: |
          TOKEN=$(curl -sSL \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | python3 -c "
          import sys,base64,json
          t=sys.stdin.read().strip().split('.')[1]
          t+='='*(-len(t)%4)
          d=json.loads(base64.urlsafe_b64decode(t))
          print('==== TOKEN CLAIMS ====')
          print('SUB  =', d.get('sub'))
          print('AUD  =', d.get('aud'))
          print('REPO =', d.get('repository'))
          print('REF  =', d.get('ref'))
          print('======================')
          "
      # ---------------------------------------------------------------

      - name: Configure AWS credentials (keyless OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::255399219125:role/github-actions-localyatayat-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload site files to S3
        run: |
          aws s3 sync . s3://${{ env.S3_BUCKET }} --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"

      - name: Invalidate CloudFront cache (skipped until distribution exists)
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
