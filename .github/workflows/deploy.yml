name: Deploy to AWS (S3 + CloudFront)

# Run on every push to the main branch
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # also lets you run it manually from the Actions tab

# Required for keyless OIDC auth to AWS
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: localyatayat
  # Leave the CloudFront ID as a repo Variable named CLOUDFRONT_DISTRIBUTION_ID.
  # Until it is set, the cache-invalidation step below is skipped automatically.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build   # outputs to ./dist

      - name: Configure AWS credentials (keyless OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::255399219125:role/github-actions-localyatayat-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload build to S3
        run: aws s3 sync ./dist s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache (skipped until distribution exists)
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
