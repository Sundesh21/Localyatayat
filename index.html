  three.js is vendored under vendor/three-0.184.0/ rather than loaded from unpkg,
  so a third-party CDN can't sit between visitors and the whole 3D scene. The
  files are byte-identical to the versions three-d-stage.js pins — each one's
  sha384 was checked against the integrity hashes in its usage notes:

    build/three.module.js                   8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J
    build/three.core.js                     dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT
    examples/jsm/controls/OrbitControls.js  4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9
    examples/jsm/exporters/OBJExporter.js   nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3
    examples/jsm/exporters/GLTFExporter.js  VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ

  The integrity block is dropped deliberately: those hashes key off the unpkg
  URLs, and pinning same-origin files you deploy yourself buys nothing while
  turning any future edit into an opaque load failure. three.module.js pulls in
  three.core.js by relative path, so both must stay side by side in build/.
  three.js is MIT — the licence is kept at vendor/three-0.184.0/LICENSE.
-->

  html, body { margin: 0; padding: 0; background: #161826; }

  /* ---- now-playing bar (geometry copied from saloon.wtf) ---- */
  /* 1px, in-viewport, invisible — YouTube throttles players it thinks are off-screen. */
  .np-yt { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }

  .np-bar {

  /* ---- 3D highway stage ----
     The scene now lives in WebGL: <three-d-stage> owns the renderer and

     scene it replaced is still in this branch's git history. */
  three-d-stage {
    position: absolute; inset: 0; width: 100%; height: 100%;
    /* Set here, not via the element's `background` attribute: that attribute is
       applied as an inline style during boot and the <x-dc> framework rewrites
       the style attribute afterwards, so it silently reverted to the default
       cream. A CSS custom property survives that. */

    /* Takes pointer input so OrbitControls works. Safe because every control —
       the bar, the horn, the links — comes after this element in the markup and
       therefore paints and hit-tests above it; only drags on empty scene reach

  }

  /* Sits behind the canvas (the renderer is alpha:true), so the page still

<!-- Glue between the 3D files and the radio. bus.js, highway.js and three-d-stage.js
     are used exactly as authored; everything specific to this page lives here. Kept
     out of <helmet> so support.js cannot clone it into a second execution. -->
<script type="module">
  import { buildBus } from './bus.js';
  import { buildHighway } from './highway.js';

  // The <x-dc> framework re-creates the body after parse, so the <three-d-stage>
  // present when this module first runs is often discarded and replaced. A one-shot
  // querySelector therefore wired a stage that was never shown — two renderers
  // booted and only the orphan had a scene. Wire whichever stage is in the document
  // now, and again if it is ever swapped out.
  async function wire(stage) {
    if (!stage || stage.__wired) return;
    stage.__wired = true;
    let THREE;
    try {
      ({ THREE } = await stage.ready);
    } catch (e) {
      return;                       // three.js failed to load; the stage shows its own message
    }

    // three-d-stage ships as a model *viewer*: orbit controls, a download toolbar
    // and a camera auto-framed to the object. None of that suits a fixed driving
    // shot, so the chrome comes off and the camera is placed by hand. Reaching into
    // the shadow root and the underscored fields is deliberate — that file's header
    // warns it is overwritten when the starter is re-copied, so this page adapts it
    // rather than editing it.
    for (const sel of ['.toolbar', '.note']) {
      const n = stage.shadowRoot.querySelector(sel);
      if (n) n.style.display = 'none';
    }

    const scene = stage._scene, camera = stage._camera, controls = stage._controls;
    controls.autoRotate = false;
    controls.enableDamping = true;

    // Keep the camera in a corridor above the road and behind the bus.
    //
    // Panning is the thing that really breaks this: right-drag moves the *target*,
    // and every other limit is measured from the target, so once it wanders the
    // camera can end up under the tarmac or buried in a hillside. With pan off the
    // target stays put at bus height and the angle limits actually mean something.
    controls.enablePan = false;
    controls.minPolarAngle = 0.90;              // ~52°, stops it going overhead
    controls.maxPolarAngle = 1.50;              // ~86°, stops it dropping to road level
    controls.minAzimuthAngle = -Infinity;       // full 360° — the vertical limit below
    controls.maxAzimuthAngle = Infinity;        //   is what keeps it out of trouble
    // The target sits mid-bus (z = -5) and the bus is 11.2 m long, so the orbit
    // radius has to clear its rear bumper: at 8 m the camera ended up inside the
    // bodywork. 15 m keeps it behind the bus even at full azimuth swing.
    controls.minDistance = 15;
    controls.maxDistance = 26;
    stage._ground.visible = false;   // the road receives the shadow instead

    const { bus, wheels } = buildBus();
    bus.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

    // Livery lettering on the white panels, kept here rather than in bus.js so that
    // model file stays exactly as authored. Positions follow its L=11.2 / W=2.5 box,
    // so they need revisiting if those dimensions change.
    const BUS_L = 11.2, BUS_W = 2.5, WORD = 'साझा यातायात';
    const FONT = '"Noto Sans Devanagari","Kohinoor Devanagari","Nirmala UI",Mangal,sans-serif';

    function decal(text, widthM, heightM) {
      const cv = document.createElement('canvas');
      cv.width = 1024; cv.height = 256;
      const g = cv.getContext('2d');
      // Shrink to fit rather than trusting one size — Devanagari metrics vary a lot
      // between the system fonts this falls back to, and overflow would clip.
      let size = 160;
      g.font = `700 ${size}px ${FONT}`;
      while (g.measureText(text).width > 960 && size > 40) {
        size -= 6;
        g.font = `700 ${size}px ${FONT}`;
      }
      g.fillStyle = '#1c7d12';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(text, 512, 132);

      const tex = new THREE.CanvasTexture(cv);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 16;
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(widthM, heightM),
        new THREE.MeshStandardMaterial({
          name: 'livery_text', map: tex, transparent: true, roughness: 0.5, metalness: 0.02,
        })
      );
      m.name = 'livery_text';
      m.castShadow = false;         // a transparent quad casting a solid shadow looks wrong
      m.receiveShadow = false;
      return m;
    }

    // Rear panel: above the plate, inboard of the tail lamps.
    const rear = decal(WORD, 1.5, 0.34);
    rear.position.set(0, 1.86, BUS_L / 2 + 0.03);
    bus.add(rear);

    // Both flanks: on the white band, between the two doors and below the waist trim.
    for (const s of [-1, 1]) {
      const side = decal(WORD, 2.6, 0.44);
      side.position.set(s * (BUS_W / 2 + 0.03), 1.72, -0.6);
      side.rotation.y = s * Math.PI / 2;
      bus.add(side);
    }

    scene.add(bus);

    const advance = buildHighway(scene);
    scene.traverse((o) => {
      if (o.isMesh && /road|shoulder|terrace|valley|kerb/.test(o.name)) o.receiveShadow = true;
    });

    // Over-the-shoulder, aimed so the rear plate is in frame: it sits at y≈1.06,
    // z≈5.65, and targeting further down the road pitched the camera up until only
    // the bus roof showed.
    camera.position.set(0, 3.7, 18);
    camera.near = 0.1;
    camera.far = 600;
    camera.updateProjectionMatrix();
    controls.target.set(0, 2.4, -5);
    controls.update();

    // setObject() would normally size the key light's shadow box to the model. We
    // skip setObject, so without this the 11m bus falls outside the shadow frustum.
    const key = stage._key;
    key.shadow.camera.left = -16; key.shadow.camera.right = 16;
    key.shadow.camera.top = 16;   key.shadow.camera.bottom = -16;
    key.shadow.camera.updateProjectionMatrix();

    const still = matchMedia('(prefers-reduced-motion: reduce)');
    const WHEEL_R = 0.55;                       // matches the tyre radius in bus.js
    let last = 0;

    stage._renderer.setAnimationLoop((t) => {
      const dt = last ? Math.min((t - last) / 1000, 0.05) : 0;
      last = t;
      // player.js publishes the speedometer; km/h -> metres travelled this frame.
      const kmh = still.matches ? 0 : (window.__kmh || 0);
      const metres = (kmh / 3.6) * dt;
      if (metres > 0) {
        advance(metres);
        for (const w of wheels) w.rotation.x -= metres / WHEEL_R;
      }
      // This loop replaced the stage's own, which is where controls.update()
      // used to live. Damped OrbitControls need it every frame or the drag has
      // no inertia and releasing leaves the camera stuck mid-motion.
      // The vertical limit depends on where you are around the bus. Directly
      // behind (or ahead) the road is clear, so the camera may sit low for the
      // over-the-shoulder shot. Swung out to the flanks that same height is
      // inside the roadside pines, so the ceiling on how low you can go lifts
      // — the camera rides up over the treeline as you come round. Setting it
      // before update() lets OrbitControls ease into the new limit.
      const side = Math.abs(Math.sin(controls.getAzimuthalAngle()));   // 0 = tail/nose, 1 = broadside
      controls.maxPolarAngle = 1.50 - side * 0.40;                     // 86° behind → 63° broadside
      controls.update();
      // Backstop: no future tweak to the limits can ever put the eye under the road.
      if (camera.position.y < 1) camera.position.y = 1;
      stage._renderer.render(scene, camera);
    });
  }

  const scan = () => wire(document.querySelector('three-d-stage'));
  scan();
  new MutationObserver(scan).observe(document.documentElement, { childList: true, subtree: true });
</script>
</body>
</html>
